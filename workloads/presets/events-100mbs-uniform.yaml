# Full-scale corpus: one hour at 100 MB/s, 512 keys, uniform.
schema: events
offered_bytes_per_s: 100MB
duration_s: 3600
partition_count: 512
alpha: 0.0
target_row_bytes: 256
batch_interval_ms: 1000
corpus_epoch: "2026-01-01T00:00:00Z"
kafka_key_columns: [user_id, partition_key]
column_overrides: {}

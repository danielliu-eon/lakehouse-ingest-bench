# Full-scale corpus: one hour at 600 MB/s, 512 keys, skewed.
# Generating this needs about 6 GB of memory per process: the generator
# buffers a whole 600 MB batch. See docs/running.md.
schema: events
offered_bytes_per_s: 600MB
duration_s: 3600
partition_count: 512
alpha: 1.0
target_row_bytes: 256
batch_interval_ms: 1000
corpus_epoch: "2026-01-01T00:00:00Z"
kafka_key_columns: [user_id, partition_key]
column_overrides: {}

# The local stack: a broker, an object store, an Iceberg catalog, and the
# harness that drives them. Enough to take a run end to end on one machine,
# which is what makes a change to the harness checkable without a cluster.
#
# Profiles split what is always up from what a command brings up:
#   (none)      kafka, minio, minio-init, iceberg-rest — the site
#   flink       the engine cluster, scaled by `--scale flink-taskmanager=N`
#   flink-job   the one-shot submitter, needing RUN_DIR
#   spark       the Spark driver, which is the whole Spark fleet, needing RUN_DIR
#   tools       the harness, run with `docker compose run --rm harness "<cmd>"`
#
# Nothing here is measured. The Flink image is amd64 (PyFlink ships no Linux
# aarch64 wheel), so on an arm64 machine it runs emulated; the Spark image is
# multi-arch and runs natively.
#
# RUN_DIR is needed only by the two commands that mount it, the Flink submitter
# and the Spark driver. Compose interpolates the whole model before it filters by
# profile, so each engine file gives the variable a default rather than requiring
# it; that default is a path that cannot hold a run, so only an actual submission
# without RUN_DIR fails, and it fails by name.
name: ingest-bench

# Relative paths inside an included file resolve against that file's own
# directory, so the engine compose file's `context: ../..` is the repo root
# whichever stack includes it.
include:
  - path: ../../../engines/flink/compose.yaml
  - path: ../../../engines/spark/compose.yaml

services:
  kafka:
    image: apache/kafka:3.9.0
    # Two client listeners, because an in-network client and a host client
    # cannot be told the same address: PLAINTEXT advertises `kafka:9092` for
    # containers, EXTERNAL advertises `localhost:29092` for the host. Both are
    # published so either path works; a host tool must use 29092, since 9092
    # answers on the host but hands back an address only a container resolves.
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # The broker answers on its port well before it will serve a metadata
    # request, so what is probed is an API call rather than the socket.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    # Not secrets. This stack is local, its data is a throwaway corpus, and
    # every other service here is configured against these two values.
    environment: {MINIO_ROOT_USER: admin, MINIO_ROOT_PASSWORD: password}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
  # A one-shot bucket create. `service_completed_successfully` on it is what
  # lets the catalog assume its warehouse bucket exists.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: ["./minio-init.sh:/init.sh:ro"]
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    ports: ["8181:8181"]
    # The fixture maps CATALOG_* to Iceberg catalog properties: the prefix
    # goes, a single underscore becomes a dot and a doubled one becomes a
    # dash. So CATALOG_S3_ENDPOINT is `s3.endpoint`, CATALOG_IO__IMPL is
    # `io-impl` and CATALOG_S3_PATH__STYLE__ACCESS is `s3.path-style-access`.
    # Its S3FileIO reads the credentials from the standard AWS variables.
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio-init: {condition: service_completed_successfully}
  # A Confluent-API schema registry, for a run whose spec says
  # `kafka.value_encoding: confluent`. Apicurio because it is Apache-2.0 and
  # serves that API at `/apis/ccompat/v7`; its default storage is in-memory,
  # which is what a stack that is torn down after every run wants.
  #
  # Up for every local run rather than behind a profile: a run that needs it
  # needs it at staging, before any engine exists, and one container that
  # registers nothing costs less than a profile every command has to remember.
  #
  # Its port is not published. Nothing on the host talks to it — the harness
  # registers and the engine reads over the compose network — and 8080 is the
  # one port a developer's machine is most likely to have taken already, which
  # would fail `up` for every run rather than only for a `confluent` one.
  # `docker compose exec schema-registry curl localhost:8080/...` reaches it.
  schema-registry:
    image: quay.io/apicurio/apicurio-registry:3.0.15
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  # Not a server: one container per command, as
  # `docker compose run --rm harness "gen-corpus --preset smoke --out s3://corpus"`.
  # The image's shell entrypoint is what makes that single quoted string a
  # command line.
  harness:
    profiles: [tools]
    build: {context: ../../.., dockerfile: Dockerfile}
    image: lakehouse-ingest-bench/harness:local
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      INGEST_BENCH_WORKLOADS: /app/workloads
    volumes:
      - ./site.yaml:/site.yaml:ro
      - ./catalog.props:/catalog.props:ro
      - ../../../runs:/runs
    # Healthy rather than started, all three: a table create against a catalog
    # whose port is open but whose handler is not yet serving fails as a
    # connection error, and the fixture image ships a `/v1/config` healthcheck
    # that says exactly when that stops being possible. The registry is the
    # same story — `stage` registers a schema against it before the run exists.
    depends_on:
      kafka: {condition: service_healthy}
      iceberg-rest: {condition: service_healthy}
      schema-registry: {condition: service_healthy}

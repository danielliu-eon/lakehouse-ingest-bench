# A minimal EKS cluster for lakehouse-ingest-bench: one amd64 managed node
# group (the Flink image is amd64-only), the Pod Identity agent, and nothing
# else. eksctl creates the VPC (three AZs, private subnets behind one NAT
# gateway), which is also where setup.sh places the MSK cluster.
#
#   eksctl create cluster -f eksctl-cluster.example.yaml     # ~20 minutes
#   eksctl delete cluster -f eksctl-cluster.example.yaml
#
# The harness never runs either command; the cluster is the operator's.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: YOUR_CLUSTER_NAME
  region: YOUR_REGION
  tags:
    lakehouse-ingest-bench: "true"
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
managedNodeGroups:
  - name: amd64
    # 4 vCPU / 16 GiB each, and a node of that shape takes one 2-CPU pod: four
    # are what a smoke spec's peak needs — two taskmanagers or executors, the
    # scorer and one producer shard, with the 1-CPU jobmanager or driver beside
    # one of them. The hour-long specs need far more; "Sizing the cluster" in
    # README.md counts both.
    instanceType: m6i.xlarge
    amiFamily: AmazonLinux2023
    desiredCapacity: 4
    minSize: 4
    maxSize: 4
    volumeSize: 80
    privateNetworking: true
    tags:
      lakehouse-ingest-bench: "true"

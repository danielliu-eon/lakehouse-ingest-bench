# Minimal EKS cluster with an amd64 node group and Pod Identity agent.
# eksctl creates a three-zone VPC with private subnets and one NAT gateway;
# setup.sh places MSK in the same VPC.
#
#   eksctl create cluster -f eksctl-cluster.example.yaml     # ~20 minutes
#   eksctl delete cluster -f eksctl-cluster.example.yaml
#
# Run these commands yourself; the harness does not manage the EKS cluster.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: YOUR_CLUSTER_NAME
  region: YOUR_REGION
  tags:
    lakehouse-ingest-bench: "true"
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
managedNodeGroups:
  - name: amd64
    # Each 4-vCPU / 16-GiB node fits one 2-CPU pod. Four nodes support smoke
    # runs: two workers, a scorer, and a producer, with room for the 1-CPU
    # coordinator. See README.md for larger-run sizing.
    instanceType: m6i.xlarge
    amiFamily: AmazonLinux2023
    desiredCapacity: 4
    minSize: 4
    maxSize: 4
    volumeSize: 80
    privateNetworking: true
    tags:
      lakehouse-ingest-bench: "true"

name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not integration"
  smoke:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'smoke')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y jq && sudo snap install yq
      - run: scripts/smoke.sh --set duration_s=30
        timeout-minutes: 40

# The external smoke, offered in the Confluent wire format instead of raw Avro.
# Everything else is `smoke-external.yaml`: what this spec exists to exercise
# is the schema registration at staging and the five-byte header on every
# value, which is what an engine that reads only Confluent Avro needs.
#
# External and not Flink: Flink's `avro-confluent` format cannot plan the
# corpus's microsecond timestamp column, so `engines/flink/knobs.py` refuses
# this encoding and says why. Start your own engine against the facts, as
# docs/adding-an-engine.md describes.
#
# The site has to declare `kafka.schema_registry`; staging refuses this spec
# before it touches the cluster otherwise.
name: smoke-external-confluent
engine: external
corpus: smoke
table:
  managed_by: harness
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
  value_encoding: confluent
scoring:
  freshness_bound_s: 60
  warmup_s: 60
external:
  name: your-engine
  version: "0.0"
  notes: "replace with the engine you are scoring"
fleet:
  - {role: worker, count: 2, vcpu: 2, gib: 2, machine_type: laptop}

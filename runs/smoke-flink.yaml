name: smoke-flink
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  # Eight slots, because a smoke run that cannot absorb its own corpus reports
  # a freshness breach rather than whether the pieces agree. Four slots hold
  # about three quarters of the corpus's 5 MB/s once the engine image is
  # emulated, which drains exactly and still misses the bound above.
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash

name: smoke-flink
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 1
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash

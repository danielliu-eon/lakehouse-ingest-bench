name: aws-smoke-spark
engine: spark
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
spark:
  # Four executor cores, matching local smoke. Cluster executors have separate JVMs;
  # allocate 4 GiB each for decoding and buffering.
  executors: 2
  executor_cores: 2
  executor_mem_mb: 4096
  driver_mem_mb: 2048
  trigger_interval: "10 seconds"
  distribution_mode: hash

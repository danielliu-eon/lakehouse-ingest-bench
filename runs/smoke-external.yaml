name: smoke-external
engine: external
corpus: smoke
table:
  managed_by: harness
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
scoring:
  freshness_bound_s: 60
  warmup_s: 60
external:
  name: your-engine
  version: "0.0"
  notes: "replace with the engine you are scoring"
fleet:
  # The compute the walk-through's stand-in engine actually gets, so a result
  # from this spec is costed against what ran. Replace it with your own.
  - {role: worker, count: 2, vcpu: 2, gib: 2, machine_type: laptop}

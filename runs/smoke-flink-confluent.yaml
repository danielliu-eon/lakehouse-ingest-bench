# `smoke-flink.yaml` with every value behind the five-byte Confluent header,
# which proves a Confluent-framed run is readable end to end by stock Flink.
#
# The source reads it with `avro-confluent`, which fetches the writer schema
# from the registry by the id in each header. The site has to declare
# `kafka.schema_registry`; staging refuses this spec before it touches the
# cluster otherwise.
name: smoke-flink-confluent
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
  value_encoding: confluent
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash

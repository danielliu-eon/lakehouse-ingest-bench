# One hour at 100 MB/s with skewed keys. This fleet is a capacity-testing starting point,
# not validated sizing. Increase taskmanagers while the gate reports UNDERSIZED; publish
# the configuration that passes.
# The 32 topic partitions match 32 slots. Measure producer throughput on the target nodes
# before accepting the five-shard setting; use ceil(offered / measured * 1.5) from
# docs/corpus.md, Sizing the offer. LZ4 reduces network traffic.
# See deploy/aws/README.md, Sizing the cluster, for engine and harness resources.
name: aws-100mbs-skew-flink-hash
engine: flink
corpus: events-100mbs-skew
table:
  partition: identity(partition_key)
kafka:
  partitions: 32
  key: user_id
producer:
  shards: 5
  compression: lz4
scoring:
  freshness_bound_s: 180
  warmup_s: 120
flink:
  # Set the actual node instance type before publishing; this does not select nodes.
  machine_type: YOUR_MACHINE_TYPE
  taskmanagers: 8
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 32
  distribution_mode: hash

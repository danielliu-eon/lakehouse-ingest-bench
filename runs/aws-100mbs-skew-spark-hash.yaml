# Spark counterpart to aws-100mbs-skew-flink-hash.yaml, with the same corpus, topic
# configuration and offer. This fleet is a capacity-testing starting point. Increase
# executors while the gate reports UNDERSIZED; publish the configuration that passes.
# Sixteen executor cores read 32 topic partitions. The default shuffle count is one
# partition per core. See deploy/aws/README.md, Sizing the cluster, for engine and harness
# resources.
name: aws-100mbs-skew-spark-hash
engine: spark
corpus: events-100mbs-skew
table:
  partition: identity(partition_key)
kafka:
  partitions: 32
  key: user_id
producer:
  shards: 5
  compression: lz4
scoring:
  freshness_bound_s: 180
  warmup_s: 120
spark:
  # Set the actual node instance type before publishing; this does not select nodes.
  machine_type: YOUR_MACHINE_TYPE
  executors: 8
  executor_cores: 2
  executor_mem_mb: 8192
  driver_cores: 2
  driver_mem_mb: 4096
  trigger_interval: "10 seconds"
  distribution_mode: hash

# One hour of offer at 100 MB/s over the skewed corpus, on a cluster. The Spark
# sibling of `aws-100mbs-skew-flink-hash.yaml`: same corpus, same topic, same
# offer, so the two runs differ only in the engine that read them.
#
# The fleet below is where the probe ladder starts, not a result: it is sized
# from the corpus and the topic, and the run it produces is what says whether it
# is enough. Raise `executors` and re-run until the gate stops reporting
# UNDERSIZED, and publish the fleet that passed — a shipped spec's fleet is the
# one that produced a committed result, so this file's is a starting point until
# a result stands behind it.
#
# Sixteen executor cores against 32 topic partitions, because Spark's Kafka
# source spreads a topic's partitions over whatever cores it has: a fleet wider
# than the topic costs idle cores rather than buying a reader. One shuffle
# partition per core, which `hash` then distributes the writers over.
name: aws-100mbs-skew-spark-hash
engine: spark
corpus: events-100mbs-skew
table:
  partition: identity(partition_key)
kafka:
  partitions: 32
  key: user_id
producer:
  shards: 2
  compression: lz4
scoring:
  freshness_bound_s: 180
  warmup_s: 120
spark:
  executors: 8
  executor_cores: 2
  executor_mem_mb: 8192
  driver_cores: 2
  driver_mem_mb: 4096
  trigger_interval: "10 seconds"
  distribution_mode: hash

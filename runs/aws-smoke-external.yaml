# The external smoke on a cluster: the harness creates the topic and the table,
# prints the facts and waits, and an engine it never touches consumes them.
# `smoke-external.yaml` is the same run on the local stack, and
# docs/adding-an-engine.md is the contract both hold you to.
#
# Two blocks here are yours before a result from this means anything. `fleet` is
# the compute your engine was given, and it is what the run is costed on — the
# harness cannot see it, so the rows below are a shape to replace and
# `YOUR_MACHINE_TYPE` is not a machine. `external` is what the result records
# the engine as: its name, its version, and whatever tuning the notes have to
# disclose.
name: aws-smoke-external
engine: external
corpus: smoke
table:
  managed_by: harness
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: user_id
producer:
  shards: 1
  # The offer crosses the cluster's network here rather than a loopback, so it
  # is compressed; `lz4` is the codec the shipped hour-long specs offer with.
  compression: lz4
scoring:
  freshness_bound_s: 60
  warmup_s: 60
external:
  name: your-engine
  version: "0.0"
  notes: "replace with the engine you are scoring"
fleet:
  - {role: coordinator, count: 1, vcpu: 1, gib: 2, machine_type: YOUR_MACHINE_TYPE}
  - {role: worker, count: 2, vcpu: 2, gib: 4, machine_type: YOUR_MACHINE_TYPE}

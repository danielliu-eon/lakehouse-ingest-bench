[project]
name = "lakehouse-ingest-bench"
version = "0.1.0"
description = "Benchmark for streaming ingest from Kafka into Apache Iceberg"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "fastavro>=1.9",
  "zstandard>=0.22",
  "confluent-kafka>=2.5",
  "pyiceberg[pyarrow,s3fs,gcsfs,sql-sqlite]>=0.9",
  "fsspec>=2024.6",
  "s3fs>=2024.6",
  "gcsfs>=2024.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Amazon MSK IAM authentication: the token signer, and the credential chain it
# signs with. An extra rather than a dependency so a site on another cloud
# installs neither, and so the harness imports on a machine that has no AWS SDK.
aws = ["aws-msk-iam-sasl-signer-python>=1.0", "boto3>=1.34"]

[project.scripts]
gen-corpus = "ingest_bench.corpus.cli:gen_corpus"
merge-corpus = "ingest_bench.corpus.cli:merge_corpus"
produce = "ingest_bench.producer.cli:main"
create-table = "ingest_bench.table.cli:create"
drop-table = "ingest_bench.table.cli:drop"
score = "ingest_bench.scorer.cli:score"
gate = "ingest_bench.scorer.cli:gate"
stage = "ingest_bench.stage:main"
render-k8s = "ingest_bench.k8s.render:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest_bench", "engines"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["ingest_bench", "engines", "tests"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "fastavro.*", "fsspec.*", "s3fs.*", "gcsfs.*", "pyarrow.*", "zstandard.*"]
ignore_missing_imports = true

# PyFlink is installed in the engine's image, never in this environment: it
# ships only x86_64 Linux and macOS wheels, and the harness has no reason to
# import the submitter that uses it.
[[tool.mypy.overrides]]
module = ["pyflink.*"]
ignore_missing_imports = true

# `confluent_kafka.admin` ships type information but declares no `__all__`, so
# under strict mode the names it re-exports from the C extension — `NewTopic`
# among them — are not importable. The alternative is importing them from the
# extension directly, which erases their types.
[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
implicit_reexport = true

# The MSK token signer ships no type information, and it is an optional extra:
# type checking has to pass on a machine that does not have it installed.
[[tool.mypy.overrides]]
module = ["aws_msk_iam_sasl_signer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local compose stack"]

# Copy to site.yaml and fill in. Every YOUR_ placeholder must go; loading refuses otherwise.
corpus_root: s3://YOUR_BUCKET/corpus
runs_root: s3://YOUR_BUCKET/runs
warehouse: s3://YOUR_BUCKET/warehouse
kafka:
  # No replication knob: staging counts the cluster's brokers and asks for
  # min(3, brokers) replicas. See docs/running.md.
  bootstrap_servers: YOUR_BOOTSTRAP:9092
  security: {}                      # optional librdkafka security.* / sasl.* keys, passed to every client
                                    # verbatim. Use ${env:NAME} for a secret; see docs/running.md.
catalog:
  props:                            # passed to pyiceberg and rendered into engine configs; ${env:NAME} works here too
    uri: http://YOUR_CATALOG:8181
    warehouse: s3://YOUR_BUCKET/warehouse
kubernetes: {}                      # empty means no cluster, and everything runs where it is started. A
                                    # cluster sets context, namespace, harness_service_account,
                                    # flink_service_account, registry and aws_region, and may add
                                    # service_account_annotations, node_selector and tolerations.
pricing:
  vcpu_hour_usd: 0.0
  gib_hour_usd: 0.0
